name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node tests/engine.test.js
      - name: Syntax check browser scripts
        run: for f in script.js site.js sw.js; do node --check "$f"; done
